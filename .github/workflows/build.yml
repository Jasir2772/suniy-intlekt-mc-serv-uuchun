name: Build CapAI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract CapAI
        run: |
          ZIP=$(ls CapAI*.zip | sort -V | tail -n 1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d capai-source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build CapAI
        working-directory: capai-source
        run: gradle clean build

      - name: Upload CapAI JAR
        uses: actions/upload-artifact@v4
        with:
          name: CapAI
          path: capai-source/build/libs/*.jar
