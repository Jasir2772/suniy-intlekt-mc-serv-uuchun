name: Build CapAI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build CapAI
        run: gradle clean build

      - name: Upload CapAI JAR
        uses: actions/upload-artifact@v4
        with:
          name: CapAI-1.0.0
          path: build/libs/*.jar
